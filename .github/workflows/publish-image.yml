name: Publish image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - requirements.txt
      - main.py
      - "src/**"
      - ".github/workflows/publish-image.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-upbit-scraper-image
  cancel-in-progress: false

jobs:
  test-build-publish:
    name: Test, build, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests/unit -p "test_*.py" -v

      - name: Run integration tests
        run: python -m unittest discover -s tests/integration -p "test_*.py" -v

      - name: Run end-to-end tests
        run: python -m unittest discover -s tests/e2e -p "test_*.py" -v

      - name: Compile Python sources
        run: python -m compileall main.py src tests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --platform linux/amd64 \
            --tag "$REGISTRY/$REPOSITORY:$IMAGE_TAG" \
            .

      - name: Push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"

      - name: Publish image details
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$REGISTRY/$REPOSITORY:$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
